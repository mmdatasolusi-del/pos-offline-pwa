<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Offline — Offline</title>
  <meta name="theme-color" content="#3B82F6">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #F9FAFB; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .offline-icon { font-size: 4rem; color: #3B82F6; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #6B7280; max-width: 360px; margin: 0 auto; }
    .btn-retry { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="text-center p-4">
    <div class="offline-icon"><i class="bi bi-wifi-off"></i></div>
    <h1>Tidak Ada Koneksi</h1>
    <p>Aplikasi sedang offline. Data lokal Anda tetap aman dan tersimpan di perangkat ini.</p>
    <p class="mt-2">Silakan periksa koneksi internet Anda, lalu coba lagi.</p>
    <button class="btn btn-primary btn-retry" onclick="window.location.reload()">
      <i class="bi bi-arrow-clockwise me-1"></i>Coba Lagi
    </button>
  </div>
</body>
</html>
